<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hello, World!</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; overflow: hidden; display: grid; place-items: center; font: 18px system-ui, sans-serif; color: #fff; background: radial-gradient(circle at 25% 20%, #5145a8, #17152e 70%); }
main { text-align: center; z-index: 1; }
h1 { font-size: clamp(2.5rem, 10vw, 6rem); margin: 0; text-shadow: 0 0 30px #aa9cff; }
p { color: #d7d0ff; }
button { border: 0; border-radius: 999px; padding: .9rem 1.4rem; color: #201c42; background: #ffe27a; font: inherit; font-weight: bold; cursor: pointer; box-shadow: 0 5px 0 #c39132; }
button:hover { transform: translateY(-2px); }
#stars { position: fixed; inset: 0; pointer-events: none; }
.star { position: absolute; color: #fff5b8; animation: twinkle 2s infinite alternate; }
@keyframes twinkle { to { opacity: .2; transform: scale(.5) rotate(40deg); } }
.pop { animation: pop .5s ease; }
@keyframes pop { 50% { transform: scale(1.3) rotate(-5deg); } }
</style>
</head>
<body>
<div id="stars"></div>
<main>
  <h1 id="hello">Hello, World! ✨</h1>
  <p>A tiny page with a little bit of magic.</p>
  <button id="surprise">Make a wish</button>
</main>
<script>
const stars = document.querySelector("#stars");
for (let i = 0; i < 45; i++) {
  const star = document.createElement("span");
  star.className = "star";
  star.textContent = "✦";
  star.style.left = Math.random() * 100 + "vw";
  star.style.top = Math.random() * 100 + "vh";
  star.style.fontSize = 8 + Math.random() * 18 + "px";
  star.style.animationDelay = Math.random() * 2 + "s";
  stars.append(star);
}
document.querySelector("#surprise").onclick = () => {
  const hello = document.querySelector("#hello");
  hello.classList.remove("pop");
  void hello.offsetWidth;
  hello.classList.add("pop");
  document.body.style.background = `radial-gradient(circle at ${Math.random()*100}% ${Math.random()*100}%, hsl(${Math.random()*360} 65% 45%), #17152e 70%)`;
};
</script>
</body>
</html>
